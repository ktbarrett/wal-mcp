[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wal_mcp"]
force-include = { "skills" = "wal_mcp/skills" }

[tool.hatch.build.targets.sdist]
exclude = [".gitignore"]

[project]
name = "wal-mcp"
version = "0.1.0"
description = "MCP server for RTL waveform analysis using WAL"
readme = "README.md"
authors = [{name = "Yossi Nivin"}]
maintainers = [{name = "Kaleb Barrett"}]
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
    "wal-lang>=0.8.0",
    "pylibfst",
]

[project.scripts]
wal-mcp-server = "wal_mcp.server:main"
wal-mcp-install-skills = "wal_mcp.install_skills:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "--cov=wal_mcp",
    "--cov-report=term-missing",
    "--cov-branch",
]

[tool.coverage.run]
branch = true
source = ["wal_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "LOG", "G"]
ignore = [
    "E741",    # ambiguous variable name (preference)
    "E501",    # line too long (preference)
    "PLR0912", # Too many branches (>12) (preference)
    "PLR0913", # Too many arguments to function call (>5) (preference)
    "PLR0915", # Too many statements (>50) (preference)
]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["wal.*", "pylibfst.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "mypy>=1.11",
    "pytest>=7.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.11",
]
