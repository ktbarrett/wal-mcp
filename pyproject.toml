[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project]
name = "wal-mcp"
version = "0.1.0"
description = "MCP server for RTL waveform analysis using WAL"
readme = "README.md"
authors = [{name = "Yossi Nivin"}]
maintainers = [{name = "Kaleb Barrett"}]
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "wal-lang>=0.8.0",
    "pylibfst",
]

[project.scripts]
wal-mcp-server = "wal_mcp.server:main"
wal-mcp-install-skill = "wal_mcp.install_skill:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "LOG", "G"]
ignore = [
    "E741",    # ambiguous variable name (preference)
    "E501",    # line too long (preference)
    "PLR0912", # Too many branches (>12) (preference)
    "PLR0913", # Too many arguments to function call (>5) (preference)
    "PLR0915", # Too many statements (>50) (preference)
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
]
